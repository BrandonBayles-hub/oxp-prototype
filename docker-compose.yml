services:
  prototype:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production

  # Dev mode — hot reload, faster iteration
  dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
